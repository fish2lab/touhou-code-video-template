# 唯一的一条 CI：构建单文件页面。
#   推到 main → 只构建，检查能过。要同时部署 GitHub Pages（介绍网页 site/ + 演示片 film/ + 特效总览 highlights/）：先在仓库 Settings → Pages 把 Source 选成 GitHub Actions，
#   再在 Settings → Secrets and variables → Actions → Variables 加 ENABLE_PAGES=true（私有仓库要付费计划才有 Pages）
#   推 v* 标签，或提交信息里带 [release] → 另外逐帧渲染 1080p MP4，一起发到 Release
#   （标签名取 package.json 的 version；由 CI 自己打标签，适合不能直接推标签的环境）
name: build & publish
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install fonttools brotli
      - run: npm ci
      - run: node tools/build.mjs
      - name: render mp4 (release only)
        if: env.RELEASE == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          npx playwright install --with-deps chromium
          node tools/render.mjs --jobs 4
          cp dist/index.html touhou-code-video-template.html
          echo "TAG=v$(node -p 'require("./package.json").version')" >> $GITHUB_ENV
      - name: release (release only)
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 模板演示 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.TAG }}
          prerelease: true
          body_path: .github/release-notes.md
          files: |
            touhou-code-video-template.html
            out/touhou-code-video-template.mp4
      - name: assemble site (pages only)
        if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
        run: |
          mkdir -p _site/film _site/highlights
          cp -r site/. _site/
          cp llms.txt _site/llms.txt
          cp dist/index.html _site/film/index.html
          cp docs/亮点.html _site/highlights/index.html
          cp -r docs/fx _site/highlights/fx
      - if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  pages:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
